apiVersion: v2
name: authup
description: Authup is an authentication & authorization system. This chart
  deploys its combined or split API, console and worker roles, with optional
  built-in PostgreSQL, MySQL and Valkey instances.
type: application
version: 0.5.1
appVersion: "1.0.0-beta.70"
kubeVersion: ">=1.25.0-0"
home: https://authup.org
icon: https://raw.githubusercontent.com/authup/helm/master/assets/icon.svg
sources:
  - https://github.com/authup/helm
  - https://github.com/authup/authup
keywords:
  - authup
  - authentication
  - authorization
  - oauth2
  - oidc
  - identity
  - sso
maintainers:
  - name: tada5hi
    url: https://github.com/tada5hi
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://authup.org
    - name: Source
      url: https://github.com/authup/helm
  artifacthub.io/changes: |
    - kind: changed
      description: Track Authup v1.0.0-beta.70; no image entrypoint, CLI, port or environment-variable contract change
    - kind: added
      description: Document the beta.70 upgrade actions (realm reach of single-record grants, scope-restricted tokens, RSA keys of at least 2048 bits)
