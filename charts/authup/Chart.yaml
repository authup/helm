apiVersion: v2
name: authup
description: Authup is an authentication & authorization system. This chart
  deploys its combined or split API, console and worker roles, with optional
  built-in PostgreSQL, MySQL and Valkey instances.
type: application
version: 0.4.0
appVersion: "1.0.0-beta.64"
kubeVersion: ">=1.25.0-0"
home: https://authup.org
icon: https://raw.githubusercontent.com/authup/helm/master/assets/icon.svg
sources:
  - https://github.com/authup/helm
  - https://github.com/authup/authup
keywords:
  - authup
  - authentication
  - authorization
  - oauth2
  - oidc
  - identity
  - sso
maintainers:
  - name: tada5hi
    url: https://github.com/tada5hi
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://authup.org
    - name: Source
      url: https://github.com/authup/helm
  artifacthub.io/changes: |
    - kind: changed
      description: Track Authup v1.0.0-beta.64 and its role-based start, migration and configuration contracts
    - kind: added
      description: Optional split auth, admin and account console workloads with single-origin Ingress and Gateway API routing
    - kind: added
      description: Optional dedicated background worker with explicit API ownership handoff
    - kind: fixed
      description: Migration and split role NetworkPolicies preserve database, cache, DNS and API connectivity under default-deny egress
    - kind: changed
      description: Configuration, provisioning and log mounts follow the beta.64 filesystem contract
