apiVersion: v2
name: authup
description: Authup is an authentication & authorization system. This chart
  deploys its combined or split API, console and worker roles, with optional
  built-in PostgreSQL, MySQL and Valkey instances.
type: application
version: 0.4.1
appVersion: "1.0.0-beta.66"
kubeVersion: ">=1.25.0-0"
home: https://authup.org
icon: https://raw.githubusercontent.com/authup/helm/master/assets/icon.svg
sources:
  - https://github.com/authup/helm
  - https://github.com/authup/authup
keywords:
  - authup
  - authentication
  - authorization
  - oauth2
  - oidc
  - identity
  - sso
maintainers:
  - name: tada5hi
    url: https://github.com/tada5hi
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://authup.org
    - name: Source
      url: https://github.com/authup/helm
  artifacthub.io/changes: |
    - kind: changed
      description: Track Authup v1.0.0-beta.66; no image entrypoint, CLI or environment-variable contract changes
    - kind: added
      description: The device authorization grant endpoints and the hosted /device page route through the existing server catch-all and auth console prefix; no new routing values
    - kind: changed
      description: A console bundle substituted through AUTH_CONSOLE_PATH must be rebuilt against auth console render contract version 5
