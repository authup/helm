apiVersion: v2
name: authup
description: Authup is an authentication & authorization system. This chart
  deploys its combined or split API, console and worker roles, with optional
  built-in PostgreSQL, MySQL and Valkey instances.
type: application
version: 0.5.6
appVersion: "1.0.0-beta.76"
kubeVersion: ">=1.25.0-0"
home: https://authup.org
icon: https://raw.githubusercontent.com/authup/helm/master/assets/icon.svg
sources:
  - https://github.com/authup/helm
  - https://github.com/authup/authup
keywords:
  - authup
  - authentication
  - authorization
  - oauth2
  - oidc
  - identity
  - sso
maintainers:
  - name: tada5hi
    url: https://github.com/tada5hi
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://authup.org
    - name: Source
      url: https://github.com/authup/helm
  artifacthub.io/changes: |
    - kind: changed
      description: Track Authup v1.0.0-beta.76
    - kind: changed
      description: Server and console probes use GET /livez (startup, liveness) and GET /readyz (readiness); readiness now fails while the database is unreachable
    - kind: added
      description: The worker gains a startup and a liveness probe on GET /livez, which restarts it when a sweep pass hangs for over 30 minutes
    - kind: added
      description: server.shutdownDelay and the console shutdownDelay values (SHUTDOWN_DELAY, default 5) keep a stopping pod serving while GET /readyz answers 503
