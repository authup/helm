## @section Cache (Valkey / external Redis)
## Optional, but REQUIRED when server.replicaCount > 1 (token blocklist,
## authorization-code store and MFA challenges are cache-backed) and strongly
## recommended when MFA is enabled.

## Built-in single-instance Valkey (docker-official image, Redis-compatible).
valkey:
  # -- Deploy the built-in Valkey instance
  enabled: false
  image:
    # -- Valkey image registry
    registry: docker.io
    # -- Valkey image repository (docker official image)
    repository: valkey/valkey
    # -- Valkey image tag
    tag: "8"
    # -- Valkey image pull policy
    pullPolicy: IfNotPresent
  auth:
    # -- Valkey password ("" = generate once, keep across upgrades)
    password: ""
  persistence:
    # -- Persist Valkey data (the cache content is reconstructable; default off)
    enabled: false
    # -- PVC size
    size: 1Gi
    # -- PVC storage class
    storageClass: ""
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey container resources
  resources:
    # @schema
    # additionalProperties: true
    # @schema
    requests:
      cpu: 50m
      memory: 64Mi
    # @schema
    # additionalProperties: true
    # @schema
    limits:
      memory: 256Mi
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey pod security context
  podSecurityContext:
    enabled: true
    fsGroup: 999
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey container security context
  containerSecurityContext:
    enabled: true
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey node selector
  nodeSelector: {}
  # -- Valkey tolerations
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey affinity
  affinity: {}

externalRedis:
  # -- Full external Redis/Valkey connection URL (redis://[user:pass@]host:port); stored in a chart-managed secret
  url: ""
  # -- External Redis host (alternative to url; the chart composes the URL)
  host: ""
  # -- External Redis port
  port: 6379
  # -- External Redis password
  password: ""
  # -- Existing secret holding a FULL connection URL (tpl-rendered)
  existingSecret: ""
  # -- Key inside externalRedis.existingSecret holding the connection URL
  existingSecretKey: redis-connection-string

## @section SMTP

smtp:
  # -- SMTP connection string (smtp(s)://user:pass@host:port); stored in a chart-managed secret
  connectionString: ""
  # -- Existing secret holding the SMTP connection string (tpl-rendered)
  existingSecret: ""
  # -- Key inside smtp.existingSecret holding the connection string
  existingSecretKey: smtp-connection-string

## @section server-core (IdP / API)

server:
  # -- Deploy the server-core service
  enabled: true
  # -- Number of server-core replicas (values > 1 REQUIRE a configured cache)
  replicaCount: 1
  # -- Public URL of server-core (PUBLIC_URL) — the OIDC issuer origin.
  # "" = derived from server.ingress when enabled. Changing it later breaks
  # enrolled WebAuthn credentials and the OIDC issuer.
  publicUrl: ""
  # -- Additional trusted first-party app origins (TRUSTED_ORIGINS). Each entry
  # is added to the redirect allowlist of the per-realm built-in system clients
  # (admin-console, account-console), so any listed origin can complete a login
  # and obtain a full-permission token. A host may carry a single "*"
  # (https://*.example.com); "**" in a host is rejected by authup at boot.
  # List or comma-separated string; tpl-rendered.
  trustedOrigins: []
  # -- Automatically append the client-admin-console UI origin to TRUSTED_ORIGINS (removes the
  # most common dead-login misconfiguration)
  trustedOriginsAppendAdminConsole: true
  # -- TRUST_PROXY setting. The chart defaults to one trusted hop (the ingress),
  # not authup's spoofable trust-everything default
  trustProxy: "1"
  features:
    # -- Enable self-service user registration (REGISTRATION_ENABLED)
    registration: false
    # -- Enable password recovery (PASSWORD_RECOVERY_ENABLED; requires SMTP)
    passwordRecovery: false
    # -- Enable email verification (EMAIL_VERIFICATION_ENABLED; requires SMTP)
    emailVerification: false
    # -- Serve the account self-service console at <publicUrl>/account
    # (profile, password, authenticators, sessions, applications).
    # ACCOUNT_CONSOLE_ENABLED; disable it when you run your own portal
    accountConsole: true
  mfa:
    # -- Enable multi-factor authentication (MFA_ENABLED)
    enabled: false
    # -- Require MFA for every user (MFA_REQUIRED; needs mfa.enabled)
    required: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- Extra environment variables rendered literally into the env ConfigMap
  # (map of NAME: value) for options without first-class values, e.g.
  # AUTH_CONSOLE_PATH / ACCOUNT_CONSOLE_PATH, which replace a served console
  # with your own build (pair them with extraVolumes; the substituted package
  # owns the login flow, so use server.theme for branding instead)
  config: {}
  # -- Content of an authup.server.core.conf mounted into the working directory
  # for file-only options (middleware objects, per-field SMTP, CORS allowlist).
  # Environment variables always win over file values.
  configuration: ""
  # -- Existing ConfigMap holding authup.server.core.conf (tpl-rendered)
  existingConfigmap: ""
  provisioning:
    # -- Mount provisioning files consumed at boot (fail-closed: an invalid file aborts startup)
    enabled: false
    # @schema
    # additionalProperties: true
    # @schema
    # -- Map of filename -> file content (tpl-rendered; the extension selects
    # the reader). Lands in a ConfigMap — credential-bearing provisioning
    # content belongs in existingSecret instead
    files: {}
    # -- Existing ConfigMap with provisioning files (tpl-rendered)
    existingConfigMap: ""
    # -- Existing Secret with provisioning files (tpl-rendered; takes
    # precedence — use for provisioning content that carries credentials)
    existingSecret: ""
  theme:
    # -- Mount an operator theme for the served consoles (the auth console and
    # the account console). Requires an authup image that supports
    # THEME_DIRECTORY_PATH; older images ignore it
    enabled: false
    # @schema
    # additionalProperties: true
    # @schema
    # -- Map of path -> file content, relative to the theme root (tpl-rendered).
    # Keys may carry a "/" ("assets/theme.css") and are projected into
    # subdirectories. Only assets/ is served over HTTP. Text only — use
    # existingConfigMap with binaryData for images
    files: {}
    # -- Existing ConfigMap holding the theme (tpl-rendered name). Use for
    # binary assets, which cannot be expressed in files
    existingConfigMap: ""
    # -- Key -> path projection for existingConfigMap, so its keys can land in
    # subdirectories (e.g. [{key: theme-css, path: assets/theme.css}]).
    # Empty mounts every key flat at the theme root
    existingConfigMapItems: []
    # -- Read fragments/head.html and splice it into the console <head>. Raw,
    # unsanitized markup on the identity provider origin, so it is opt-in
    fragmentsEnabled: false
  migration:
    # -- Run `server/core migration run` as a pre-upgrade hook Job. Recommended
    # for multi-replica deployments (serializes DDL before pods roll). Fresh
    # installs migrate at boot regardless.
    enabled: false
    # -- Job backoff limit
    backoffLimit: 3
    # -- Delete the Job this many seconds after it finishes ("" = keep)
    ttlSecondsAfterFinished: 300
    # @schema
    # additionalProperties: true
    # @schema
    # -- Job pod annotations
    podAnnotations: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Job resources ({} = server resources defaults)
    resources: {}
  # -- Override the container command
  command: []
  # -- Override the container args
  args: []
  # -- Extra environment variables for the server container
  extraEnvVars: []
  # -- Extra ConfigMap with environment variables (tpl-rendered name)
  extraEnvVarsCM: ""
  # -- Extra Secret with environment variables (tpl-rendered name)
  extraEnvVarsSecret: ""
  # -- Extra volumes (tpl-rendered)
  extraVolumes: []
  # -- Extra volume mounts (tpl-rendered)
  extraVolumeMounts: []
  # -- Init containers (tpl-rendered)
  initContainers: []
  # -- Sidecar containers (tpl-rendered)
  sidecars: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Container lifecycle hooks
  lifecycleHooks: {}
  # -- Pod host aliases
  hostAliases: []
  # -- Pod termination grace period (server-core tears down within ~10s after signal)
  terminationGracePeriodSeconds: 30
  # @schema
  # additionalProperties: true
  # @schema
  # -- Deployment update strategy
  updateStrategy:
    type: RollingUpdate
  # -- Deployment revision history limit
  revisionHistoryLimit: 3
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod annotations (tpl-rendered)
  podAnnotations: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod labels (tpl-rendered)
  podLabels: {}
  # -- Disable the checksum annotations that roll pods on config/secret changes
  disableRestartOnChanges: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod security context
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  # @schema
  # additionalProperties: true
  # @schema
  # -- Container security context. The upstream image runs as root and needs a
  # writable npm cache; the chart mounts emptyDirs at /usr/src/app/writable and
  # /tmp to keep readOnlyRootFilesystem viable.
  containerSecurityContext:
    enabled: true
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- Server container resources
  resources:
    # @schema
    # additionalProperties: true
    # @schema
    requests:
      cpu: 250m
      memory: 512Mi
    # @schema
    # additionalProperties: true
    # @schema
    limits:
      memory: 2Gi
  startupProbe:
    # -- Enable the startup probe (first boot runs database creation, migrations and provisioning)
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1
  livenessProbe:
    # -- Enable the liveness probe (GET / status endpoint)
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    # -- Enable the readiness probe (GET / status endpoint)
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom startup probe overriding the structured one
  customStartupProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom liveness probe
  customLivenessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom readiness probe
  customReadinessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Affinity (overrides the anti-affinity preset when set)
  affinity: {}
  # -- Pod anti-affinity preset: soft, hard or ""
  podAntiAffinityPreset: soft
  # -- Topology spread constraints (a missing labelSelector is filled with the pod's selector labels)
  topologySpreadConstraints: []
  # -- Priority class name
  priorityClassName: ""
  # -- Scheduler name
  schedulerName: ""
  service:
    # -- Service type
    type: ClusterIP
    ports:
      # -- Service HTTP port (the container port is fixed at 3000)
      http: 3000
    nodePorts:
      # -- Node port ("" = auto-assign)
      http: ""
    # -- Static cluster IP
    clusterIP: ""
    # -- LoadBalancer IP
    loadBalancerIP: ""
    # -- LoadBalancer source ranges
    loadBalancerSourceRanges: []
    # -- External traffic policy
    externalTrafficPolicy: Cluster
    # -- Session affinity
    sessionAffinity: None
    # @schema
    # additionalProperties: true
    # @schema
    # -- Session affinity config
    sessionAffinityConfig: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Service annotations (tpl-rendered)
    annotations: {}
    # -- Extra service ports
    extraPorts: []
  ingress:
    # -- Enable ingress for server-core. NOTE: this also exposes the
    # UNAUTHENTICATED /metrics endpoint publicly — block it at the ingress
    # controller or disable it via server.configuration
    # ("middlewarePrometheus: false") when it is not scraped
    enabled: false
    # -- Ingress hostname (tpl-rendered); also drives the derived PUBLIC_URL
    hostname: ""
    # -- Ingress path
    path: /
    # -- Ingress path type
    pathType: Prefix
    # -- Ingress class name
    ingressClassName: ""
    # @schema
    # additionalProperties: true
    # @schema
    # -- Ingress annotations (tpl-rendered). Token responses are large; with
    # ingress-nginx consider proxy-buffer-size 16k+.
    annotations: {}
    # -- Enable TLS for the hostname (secret <hostname>-tls unless extraTls overrides)
    tls: false
    # -- Request a cert-manager certificate (adds kubernetes.io/tls-acme)
    certManager: false
    # -- Extra hosts
    extraHosts: []
    # -- Extra paths for the primary host
    extraPaths: []
    # -- Extra TLS entries
    extraTls: []
    # -- Full custom rules (tpl-rendered; overrides the generated rule)
    extraRules: []
  route:
    # -- Create a Gateway API HTTPRoute for server-core
    enabled: false
    # -- Route hostnames ([] = derived from server.publicUrl / ingress hostname)
    hostnames: []
    # -- Gateway parentRefs
    parentRefs: []
    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTPRoute annotations
    annotations: {}
  metrics:
    # -- The /metrics endpoint is UNAUTHENTICATED; keep it off the public ingress
    serviceMonitor:
      # -- Create a prometheus-operator ServiceMonitor scraping /metrics
      enabled: false
      # -- ServiceMonitor namespace ("" = release namespace)
      namespace: ""
      # -- Scrape interval
      interval: 30s
      # -- Scrape timeout
      scrapeTimeout: ""
      # @schema
      # additionalProperties: true
      # @schema
      # -- ServiceMonitor labels
      labels: {}
      # -- Honor labels
      honorLabels: false
      # -- Metric relabelings
      metricRelabelings: []
      # -- Relabelings
      relabelings: []
      # -- Job label
      jobLabel: ""
  pdb:
    # -- Create a PodDisruptionBudget for server-core
    create: false
    # -- Minimum available pods
    minAvailable: ""
    # -- Maximum unavailable pods (defaults to 1 when both are empty)
    maxUnavailable: ""
  autoscaling:
    hpa:
      # -- Enable HPA for server-core (requires a configured cache)
      enabled: false
      # -- Minimum replicas
      minReplicas: 2
      # -- Maximum replicas
      maxReplicas: 5
      # -- Target CPU utilization percentage
      targetCPU: 75
      # -- Target memory utilization percentage
      targetMemory: ""
  networkPolicy:
    # -- Create a NetworkPolicy for server-core
    enabled: false
    # -- Allow ingress from anywhere. When false, only same-namespace pods,
    # the release's UI pods and the configured selectors may connect — add
    # your ingress controller via ingressNSMatchLabels/ingressPodMatchLabels
    allowExternal: true
    # -- Allow all egress
    allowExternalEgress: true
    # @schema
    # additionalProperties: true
    # @schema
    # -- Pod labels allowed to connect when allowExternal is false
    ingressPodMatchLabels: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Namespace labels allowed to connect when allowExternal is false
    ingressNSMatchLabels: {}
    # -- Extra ingress rules
    extraIngress: []
    # -- Extra egress rules
    extraEgress: []

## @section client-admin-console (admin UI)

adminConsole:
  # -- Deploy the client-admin-console admin UI (false = headless IdP)
  enabled: true
  # -- Number of UI replicas (fully stateless, scale freely)
  replicaCount: 1
  # -- Public URL of the UI (NUXT_PUBLIC_PUBLIC_URL). "" = derived from adminConsole.ingress
  publicUrl: ""
  # -- Browser-facing server-core URL (NUXT_PUBLIC_API_URL). "" = the server public URL.
  # Must be reachable from the user's browser, never a cluster-internal DNS name
  apiUrl: ""
  # -- Server-side (SSR) API URL override (NUXT_API_URL), e.g. the in-cluster
  # service URL to keep SSR traffic off the ingress
  internalApiUrl: ""
  # @schema
  # additionalProperties: true
  # @schema
  # -- Extra environment variables rendered literally into the env ConfigMap
  config: {}
  # -- Override the container command
  command: []
  # -- Override the container args
  args: []
  # -- Extra environment variables for the UI container
  extraEnvVars: []
  # -- Extra ConfigMap with environment variables (tpl-rendered name)
  extraEnvVarsCM: ""
  # -- Extra Secret with environment variables (tpl-rendered name)
  extraEnvVarsSecret: ""
  # -- Extra volumes (tpl-rendered)
  extraVolumes: []
  # -- Extra volume mounts (tpl-rendered)
  extraVolumeMounts: []
  # -- Init containers (tpl-rendered)
  initContainers: []
  # -- Sidecar containers (tpl-rendered)
  sidecars: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Container lifecycle hooks
  lifecycleHooks: {}
  # -- Pod host aliases
  hostAliases: []
  # -- Pod termination grace period
  terminationGracePeriodSeconds: 30
  # @schema
  # additionalProperties: true
  # @schema
  # -- Deployment update strategy
  updateStrategy:
    type: RollingUpdate
  # -- Deployment revision history limit
  revisionHistoryLimit: 3
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod annotations (tpl-rendered)
  podAnnotations: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod labels (tpl-rendered)
  podLabels: {}
  # -- Disable the checksum annotations that roll pods on config changes
  disableRestartOnChanges: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod security context
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  # @schema
  # additionalProperties: true
  # @schema
  # -- Container security context (same root-image caveat as the server)
  containerSecurityContext:
    enabled: true
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- UI container resources
  resources:
    # @schema
    # additionalProperties: true
    # @schema
    requests:
      cpu: 100m
      memory: 256Mi
    # @schema
    # additionalProperties: true
    # @schema
    limits:
      memory: 512Mi
  startupProbe:
    # -- Enable the startup probe
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 24
    successThreshold: 1
  livenessProbe:
    # -- Enable the liveness probe
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    # -- Enable the readiness probe
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom startup probe
  customStartupProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom liveness probe
  customLivenessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom readiness probe
  customReadinessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Affinity (overrides the anti-affinity preset when set)
  affinity: {}
  # -- Pod anti-affinity preset: soft, hard or ""
  podAntiAffinityPreset: soft
  # -- Topology spread constraints
  topologySpreadConstraints: []
  # -- Priority class name
  priorityClassName: ""
  # -- Scheduler name
  schedulerName: ""
  service:
    # -- Service type
    type: ClusterIP
    ports:
      # -- Service HTTP port (the container port is fixed at 3000)
      http: 3000
    nodePorts:
      # -- Node port ("" = auto-assign)
      http: ""
    # -- Static cluster IP
    clusterIP: ""
    # -- LoadBalancer IP
    loadBalancerIP: ""
    # -- LoadBalancer source ranges
    loadBalancerSourceRanges: []
    # -- External traffic policy
    externalTrafficPolicy: Cluster
    # -- Session affinity
    sessionAffinity: None
    # @schema
    # additionalProperties: true
    # @schema
    # -- Session affinity config
    sessionAffinityConfig: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Service annotations (tpl-rendered)
    annotations: {}
    # -- Extra service ports
    extraPorts: []
  ingress:
    # -- Enable ingress for the UI
    enabled: false
    # -- Ingress hostname (tpl-rendered); also drives the derived UI public URL
    hostname: ""
    # -- Ingress path
    path: /
    # -- Ingress path type
    pathType: Prefix
    # -- Ingress class name
    ingressClassName: ""
    # @schema
    # additionalProperties: true
    # @schema
    # -- Ingress annotations (tpl-rendered)
    annotations: {}
    # -- Enable TLS for the hostname
    tls: false
    # -- Request a cert-manager certificate (adds kubernetes.io/tls-acme)
    certManager: false
    # -- Extra hosts
    extraHosts: []
    # -- Extra paths for the primary host
    extraPaths: []
    # -- Extra TLS entries
    extraTls: []
    # -- Full custom rules (tpl-rendered; overrides the generated rule)
    extraRules: []
  route:
    # -- Create a Gateway API HTTPRoute for the UI
    enabled: false
    # -- Route hostnames ([] = derived from adminConsole.publicUrl / ingress hostname)
    hostnames: []
    # -- Gateway parentRefs
    parentRefs: []
    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTPRoute annotations
    annotations: {}
  pdb:
    # -- Create a PodDisruptionBudget for the UI
    create: false
    # -- Minimum available pods
    minAvailable: ""
    # -- Maximum unavailable pods (defaults to 1 when both are empty)
    maxUnavailable: ""
  autoscaling:
    hpa:
      # -- Enable HPA for the UI
      enabled: false
      # -- Minimum replicas
      minReplicas: 2
      # -- Maximum replicas
      maxReplicas: 5
      # -- Target CPU utilization percentage
      targetCPU: 75
      # -- Target memory utilization percentage
      targetMemory: ""
  networkPolicy:
    # -- Create a NetworkPolicy for the UI
    enabled: false
    # -- Allow ingress from anywhere
    allowExternal: true
    # -- Allow all egress
    allowExternalEgress: true
    # @schema
    # additionalProperties: true
    # @schema
    # -- Pod labels allowed to connect when allowExternal is false
    ingressPodMatchLabels: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Namespace labels allowed to connect when allowExternal is false
    ingressNSMatchLabels: {}
    # -- Extra ingress rules
    extraIngress: []
    # -- Extra egress rules
    extraEgress: []

## @section Service account

serviceAccount:
  # -- Create a ServiceAccount (shared by both services)
  create: true
  # -- ServiceAccount name ("" = generated from the fullname)
  name: ""
  # @schema
  # additionalProperties: true
  # @schema
  # -- ServiceAccount annotations (tpl-rendered)
  annotations: {}
  # -- Automount the service account token
  automountServiceAccountToken: false
