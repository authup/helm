{{- if and .Values.server.enabled .Values.worker.enabled .Values.worker.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authup.worker.fullname" . }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "worker") | nindent 4 }}
  annotations: {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "authup.matchLabels" (dict "context" $ "component" "worker") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.worker.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    {{- if .Values.worker.networkPolicy.extraEgress }}
    {{- include "authup.tplvalues.render" (dict "value" .Values.worker.networkPolicy.extraEgress "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
