{{/*
Render-nothing fail-fast guards for cross-field rules the JSON schema cannot
express. Keep every check cheap: this file renders on all helm operations.
*/}}

{{/* A database is mandatory: the published image bakes NODE_ENV=production, which forbids sqlite. */}}
{{- if and .Values.server.enabled (not .Values.postgresql.enabled) (not .Values.mysql.enabled) (not .Values.externalDatabase.host) }}
{{- fail "authup: no database configured. Enable postgresql.enabled or mysql.enabled, or set externalDatabase.host — the authup image cannot boot without a database (sqlite is not available in production images)." }}
{{- end }}

{{- if and .Values.postgresql.enabled .Values.mysql.enabled }}
{{- fail "authup: postgresql.enabled and mysql.enabled are mutually exclusive — pick one built-in database engine." }}
{{- end }}

{{- if and (not .Values.postgresql.enabled) (not .Values.mysql.enabled) .Values.externalDatabase.host (not (has .Values.database.type (list "postgres" "mysql"))) }}
{{- fail (printf "authup: unknown database.type %q — must be 'postgres' or 'mysql'." .Values.database.type) }}
{{- end }}

{{/*
Replicas > 1 without a shared cache silently break logins (the authorization-code
store, token blocklist and MFA challenges fall back to a per-process memory cache).
*/}}
{{- if and .Values.server.enabled (not (include "authup.redis.enabled" .)) }}
{{- if or (gt (int .Values.server.replicaCount) 1) .Values.server.autoscaling.hpa.enabled }}
{{- fail "authup: server.replicaCount > 1 (or server HPA) requires a shared cache. Enable valkey.enabled or configure externalRedis — without it, logins and MFA challenges break across replicas." }}
{{- end }}
{{- end }}

{{- if and .Values.server.mfa.required (not .Values.server.mfa.enabled) }}
{{- fail "authup: server.mfa.required needs server.mfa.enabled=true (authup itself refuses to boot otherwise)." }}
{{- end }}

{{- if and .Values.auth.existingSecret (or .Values.auth.adminPassword .Values.auth.systemClientSecret .Values.auth.secretsEncryptionKey) }}
{{- fail "authup: auth.existingSecret and inline auth values are mutually exclusive — when an existing secret is referenced, the inline adminPassword / systemClientSecret / secretsEncryptionKey values are unused; remove them to avoid a false sense of configuration." }}
{{- end }}

{{/*
Same shape as the auth pair above, and worth its own guard because the value it
drops is usually load-bearing: server.configuration is where db.ssl / socketPath
/ replication live, and those decide how BOTH the server pods and the pre-upgrade
migration hook connect. Existing-wins silently would mean believing TLS to the
database is configured while the mounted file is the operator's.
*/}}
{{- if and .Values.server.enabled .Values.server.configuration .Values.server.existingConfigmap }}
{{- fail "authup: server.configuration and server.existingConfigmap are mutually exclusive. The existing ConfigMap is the one that gets mounted, so the inline content would be silently dropped: move it into that ConfigMap, or drop server.existingConfigmap." }}
{{- end }}

{{- if not (eq (toString .Values.server.features.accountConsole) "") }}
{{- fail "authup: server.features.accountConsole moved to accountConsole.enabled in the beta.64 topology." }}
{{- end }}

{{- if and .Values.server.splitConsoles (not .Values.server.enabled) }}
{{- fail "authup: server.splitConsoles requires server.enabled=true." }}
{{- end }}
{{- if and .Values.server.splitConsoles (not .Values.authConsole.enabled) }}
{{- fail "authup: server.splitConsoles requires authConsole.enabled=true because the auth console owns the login flow." }}
{{- end }}
{{- if .Values.server.splitConsoles }}
{{- $publicUrl := include "authup.server.publicUrl" . }}
{{- if not $publicUrl }}
{{- fail "authup: server.splitConsoles requires server.publicUrl or an enabled server.ingress with a hostname so every role shares one origin." }}
{{- end }}
{{- $path := (urlParse $publicUrl).path }}
{{- if and $path (ne $path "/") }}
{{- fail "authup: server.splitConsoles requires server.publicUrl at the origin root because the console routes use fixed /console/* paths." }}
{{- end }}
{{- $publicHostname := regexReplaceAll ":[0-9]+$" (urlParse $publicUrl).host "" }}
{{- $serverRouteEnabled := include "authup.flag" (dict "value" .Values.server.route.enabled "context" $ "key" "server.route.enabled") }}
{{- if $serverRouteEnabled }}
{{- range .Values.server.route.hostnames }}
{{- $hostname := include "authup.tplvalues.render" (dict "value" . "context" $) }}
{{- if ne $hostname $publicHostname }}
{{- fail "authup: server.route.hostnames must match server.publicUrl in split-console mode." }}
{{- end }}
{{- end }}
{{- end }}
{{- range $name, $console := dict "authConsole" .Values.authConsole "adminConsole" .Values.adminConsole "accountConsole" .Values.accountConsole }}
{{- if and $.Values.server.ingress.enabled $console.enabled $console.ingress.enabled $console.ingress.hostname }}
{{- $serverIngressHostname := include "authup.tplvalues.render" (dict "value" $.Values.server.ingress.hostname "context" $) }}
{{- $hostname := include "authup.tplvalues.render" (dict "value" $console.ingress.hostname "context" $) }}
{{- if ne $hostname $serverIngressHostname }}
{{- fail (printf "authup: %s.ingress.hostname must match server.ingress.hostname in split-console mode." $name) }}
{{- end }}
{{- end }}
{{- if and $serverRouteEnabled $console.enabled (include "authup.flag" (dict "value" $console.route.enabled "context" $ "key" (printf "%s.route.enabled" $name))) }}
{{- range $console.route.hostnames }}
{{- $hostname := include "authup.tplvalues.render" (dict "value" . "context" $) }}
{{- if ne $hostname $publicHostname }}
{{- fail (printf "authup: %s.route.hostnames must match server.publicUrl in split-console mode." $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{/* Browser traffic reaches the API through the ingress controller; console peers do not cover it. */}}
{{- if and .Values.server.enabled .Values.server.networkPolicy.enabled (not .Values.server.networkPolicy.allowExternal) (not .Values.server.networkPolicy.ingressPodMatchLabels) (not .Values.server.networkPolicy.ingressNSMatchLabels) (not .Values.server.networkPolicy.extraIngress) }}
{{- fail "authup: server.networkPolicy.allowExternal=false needs an ingress source for browser traffic (ingressNSMatchLabels, ingressPodMatchLabels or extraIngress); split console peers do not cover it." }}
{{- end }}
{{- if and .Values.worker.enabled (not .Values.server.enabled) }}
{{- fail "authup: worker.enabled requires server.enabled=true because the worker shares the server configuration and credentials." }}
{{- end }}
{{- if and .Values.server.splitConsoles (or (and .Values.authConsole.enabled .Values.authConsole.ingress.enabled) (and .Values.adminConsole.enabled .Values.adminConsole.ingress.enabled) (and .Values.accountConsole.enabled .Values.accountConsole.ingress.enabled)) (not .Values.server.ingress.enabled) }}
{{- fail "authup: split console Ingress requires server.ingress.enabled=true so core owns the API and login callback paths." }}
{{- end }}
{{- if and .Values.server.splitConsoles (or (and .Values.authConsole.enabled (include "authup.flag" (dict "value" .Values.authConsole.route.enabled "context" $ "key" "authConsole.route.enabled"))) (and .Values.adminConsole.enabled (include "authup.flag" (dict "value" .Values.adminConsole.route.enabled "context" $ "key" "adminConsole.route.enabled"))) (and .Values.accountConsole.enabled (include "authup.flag" (dict "value" .Values.accountConsole.route.enabled "context" $ "key" "accountConsole.route.enabled")))) (not (include "authup.flag" (dict "value" .Values.server.route.enabled "context" $ "key" "server.route.enabled"))) }}
{{- fail "authup: split console HTTPRoute requires server.route.enabled=true so core owns the API and login callback paths." }}
{{- end }}

{{/* An external database password must be deliberate — never silently generated for a database the chart does not own. */}}
{{- if and (not .Values.postgresql.enabled) (not .Values.mysql.enabled) .Values.externalDatabase.host (not .Values.externalDatabase.password) (not .Values.externalDatabase.existingSecret) }}
{{- fail "authup: externalDatabase.host is set but neither externalDatabase.password nor externalDatabase.existingSecret is — the chart will not invent a password for a database it does not manage." }}
{{- end }}

{{- if and .Values.server.ingress.enabled (not .Values.server.ingress.hostname) (not .Values.server.ingress.extraHosts) (not .Values.server.ingress.extraRules) }}
{{- fail "authup: server.ingress.enabled requires server.ingress.hostname (or extraHosts / extraRules)." }}
{{- end }}
{{- if and .Values.server.splitConsoles .Values.authConsole.enabled .Values.authConsole.ingress.enabled (not .Values.authConsole.ingress.hostname) (not .Values.server.ingress.hostname) (not .Values.authConsole.ingress.extraRules) }}
{{- fail "authup: authConsole.ingress.enabled requires authConsole.ingress.hostname, server.ingress.hostname, or extraRules." }}
{{- end }}
{{- if and .Values.server.splitConsoles .Values.adminConsole.enabled .Values.adminConsole.ingress.enabled (not .Values.adminConsole.ingress.hostname) (not .Values.server.ingress.hostname) (not .Values.adminConsole.ingress.extraRules) }}
{{- fail "authup: adminConsole.ingress.enabled requires adminConsole.ingress.hostname, server.ingress.hostname, or extraRules." }}
{{- end }}
{{- if and .Values.server.splitConsoles .Values.accountConsole.enabled .Values.accountConsole.ingress.enabled (not .Values.accountConsole.ingress.hostname) (not .Values.server.ingress.hostname) (not .Values.accountConsole.ingress.extraRules) }}
{{- fail "authup: accountConsole.ingress.enabled requires accountConsole.ingress.hostname, server.ingress.hostname, or extraRules." }}
{{- end }}

{{/*
The route flags are validated here unconditionally. The render gates spell
`and <component>.enabled (include "authup.flag" ...)`, and Go short-circuits
`and`, so a disabled component would never reach the helper: the schema used to
reject a bad value either way, and widening it to [boolean, string] moved that
job into the template.
*/}}
{{- $_ := include "authup.flag" (dict "value" .Values.server.route.enabled "context" $ "key" "server.route.enabled") }}
{{- $_ = include "authup.flag" (dict "value" .Values.authConsole.route.enabled "context" $ "key" "authConsole.route.enabled") }}
{{- $_ = include "authup.flag" (dict "value" .Values.adminConsole.route.enabled "context" $ "key" "adminConsole.route.enabled") }}
{{- $_ = include "authup.flag" (dict "value" .Values.accountConsole.route.enabled "context" $ "key" "accountConsole.route.enabled") }}

{{/*
A Gateway API HTTPRoute rule without `matches` defaults to PathPrefix "/", i.e. it
matches every request on every hostname the route attaches to. The route hostname is
derived from the public URL's ORIGIN, so a sub-path public URL would silently attach
authup as the catch-all backend of a hostname it is meant to share. authup always
serves at "/" and expects the proxy to strip the prefix, hence match AND rewrite.
*/}}
{{- if and .Values.server.enabled (include "authup.flag" (dict "value" .Values.server.route.enabled "context" $ "key" "server.route.enabled")) (not .Values.server.route.matches) }}
{{- $path := (urlParse (include "authup.server.publicUrl" .)).path }}
{{- if and $path (ne $path "/") }}
{{- fail (printf "authup: the server public URL carries the path %q but server.route.matches is empty, which the Gateway API defaults to PathPrefix \"/\" (a catch-all on every hostname this route attaches to). authup serves at \"/\" and expects the proxy to strip the prefix, so set both:\n  server.route.matches: [{path: {type: PathPrefix, value: %s}}]\n  server.route.filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]" $path $path) }}
{{- end }}
{{- end }}
{{/* URL values must carry a scheme. */}}
{{- range $key, $value := dict "server.publicUrl" .Values.server.publicUrl }}
{{- if and $value (not (contains "{{" $value)) (not (regexMatch "^https?://" $value)) }}
{{- fail (printf "authup: %s must be a full URL including the http(s):// scheme (got %q)." $key $value) }}
{{- end }}
{{- end }}

{{- if and .Values.auth.secretsEncryptionKeyEnabled (not .Values.auth.existingSecret) (not .Values.auth.secretsEncryptionKey) }}
{{- fail "authup: auth.secretsEncryptionKeyEnabled requires the key to come from somewhere — set auth.secretsEncryptionKey or reference it via auth.existingSecret." }}
{{- end }}

{{/*
Under useHelmHooks=false the chart sets argocd.argoproj.io/sync-wave itself on the
built-in database, the ServiceAccount and the migration Job's Secrets, to keep the
Job ordered after all of them (issue #30). Only those resources route their wave
through the authup.annotations helper; the migration Job, its ConfigMap and its
NetworkPolicy carry their own fixed waves as template literals. A user-supplied
commonAnnotations or serviceAccount.annotations value for the same key would
collide with only the first group, inverting the ordering instead of overriding
it everywhere, so both are rejected outright rather than silently mishandled.
*/}}
{{- if and (not .Values.useHelmHooks) (hasKey (.Values.commonAnnotations | default dict) "argocd.argoproj.io/sync-wave") }}
{{- fail "authup: commonAnnotations must not set argocd.argoproj.io/sync-wave when useHelmHooks=false. The chart manages that annotation itself to keep the migration Job ordered after the built-in database, the ServiceAccount and its Secrets." }}
{{- end }}
{{- if and (not .Values.useHelmHooks) .Values.serviceAccount.create (hasKey (.Values.serviceAccount.annotations | default dict) "argocd.argoproj.io/sync-wave") }}
{{- fail "authup: serviceAccount.annotations must not set argocd.argoproj.io/sync-wave when useHelmHooks=false. The chart manages that annotation itself to keep the migration Job ordered after the ServiceAccount." }}
{{- end }}

{{/*
Deprecation tripwires: when a value moves, add a guard here that names the new
location, e.g.
  if .Values.<oldKey> -> fail "authup: `<oldKey>` moved to `server.<newKey>` in chart 0.X. See BREAKING.md."
*/}}
{{- if and .Values.server.config (hasKey .Values.server.config "WRITABLE_DIRECTORY_PATH") }}
{{- fail "authup: server.config.WRITABLE_DIRECTORY_PATH is retired in beta.64: logs live at /var/log/authup and provisioning at /etc/authup/provisioning. See BREAKING.md." }}
{{- end }}
