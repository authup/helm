{{- if and .Values.server.enabled .Values.server.migration.enabled .Values.server.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authup.component.fullname" (dict "context" . "suffix" "server-migration") }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "migration") | nindent 4 }}
  annotations:
    {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
    {{- if .Values.useHelmHooks }}
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
    {{- else }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
    {{- end }}
spec:
  podSelector:
    matchLabels: {{- include "authup.matchLabels" (dict "context" $ "component" "migration") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.server.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    {{- if .Values.server.networkPolicy.extraEgress }}
    {{- include "authup.tplvalues.render" (dict "value" .Values.server.networkPolicy.extraEgress "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
