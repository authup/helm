{{- if and .Values.server.enabled .Values.server.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "authup.server.fullname" . }}
  namespace: {{ default (include "authup.namespace" .) .Values.server.metrics.serviceMonitor.namespace | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "server") | nindent 4 }}
    {{- if .Values.server.metrics.serviceMonitor.labels }}
    {{- include "authup.tplvalues.render" (dict "value" .Values.server.metrics.serviceMonitor.labels "context" $) | nindent 4 }}
    {{- end }}
  annotations: {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
spec:
  {{- if .Values.server.metrics.serviceMonitor.jobLabel }}
  jobLabel: {{ .Values.server.metrics.serviceMonitor.jobLabel }}
  {{- end }}
  namespaceSelector:
    matchNames:
      - {{ include "authup.namespace" . | quote }}
  selector:
    matchLabels: {{- include "authup.matchLabels" (dict "context" $ "component" "server") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      {{- if .Values.server.metrics.serviceMonitor.interval }}
      interval: {{ .Values.server.metrics.serviceMonitor.interval }}
      {{- end }}
      {{- if .Values.server.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.server.metrics.serviceMonitor.scrapeTimeout }}
      {{- end }}
      honorLabels: {{ .Values.server.metrics.serviceMonitor.honorLabels }}
      {{- if .Values.server.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings: {{- include "authup.tplvalues.render" (dict "value" .Values.server.metrics.serviceMonitor.metricRelabelings "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.server.metrics.serviceMonitor.relabelings }}
      relabelings: {{- include "authup.tplvalues.render" (dict "value" .Values.server.metrics.serviceMonitor.relabelings "context" $) | nindent 8 }}
      {{- end }}
{{- end }}
