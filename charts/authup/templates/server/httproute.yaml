{{- if and .Values.server.enabled (include "authup.flag" (dict "value" .Values.server.route.enabled "context" $ "key" "server.route.enabled")) }}
{{- include "authup.httproute" (dict
  "context" $
  "component" "server"
  "name" (include "authup.server.fullname" .)
  "route" .Values.server.route
  "serviceName" (include "authup.server.fullname" .)
  "servicePort" .Values.server.service.ports.http
  "publicUrl" (include "authup.server.publicUrl" .)
) }}
{{- end }}
