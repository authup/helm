{{- if .Values.valkey.enabled }}
{{/*
The password and the composed connection URL live in ONE secret so both are
derived from a single generated value (two lookup-or-generate calls would
diverge on a fresh install).
*/}}
{{- $secretName := include "authup.valkey.fullname" . }}
{{- $password := include "authup.secret.rawValue" (dict "secret" $secretName "key" "password" "value" .Values.valkey.auth.password "length" 32 "context" $) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "valkey") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  connection-string: {{ printf "redis://default:%s@%s:6379" (urlquery $password) $secretName | b64enc | quote }}
{{- end }}
