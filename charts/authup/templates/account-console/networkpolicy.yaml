{{- if and .Values.server.enabled .Values.server.splitConsoles .Values.accountConsole.enabled .Values.accountConsole.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authup.accountConsole.fullname" . }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "account-console") | nindent 4 }}
  annotations: {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "authup.matchLabels" (dict "context" $ "component" "account-console") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.accountConsole.containerPorts.http }}
          protocol: TCP
      {{- if not .Values.accountConsole.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
        {{- if .Values.accountConsole.networkPolicy.ingressPodMatchLabels }}
        - podSelector:
            matchLabels: {{- include "authup.tplvalues.render" (dict "value" .Values.accountConsole.networkPolicy.ingressPodMatchLabels "context" $) | nindent 14 }}
        {{- end }}
        {{- if .Values.accountConsole.networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels: {{- include "authup.tplvalues.render" (dict "value" .Values.accountConsole.networkPolicy.ingressNSMatchLabels "context" $) | nindent 14 }}
        {{- end }}
      {{- end }}
    {{- if .Values.accountConsole.networkPolicy.extraIngress }}
    {{- include "authup.tplvalues.render" (dict "value" .Values.accountConsole.networkPolicy.extraIngress "context" $) | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.accountConsole.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels: {{- include "authup.matchLabels" (dict "context" $ "component" "server") | nindent 14 }}
    {{- end }}
    {{- if .Values.accountConsole.networkPolicy.extraEgress }}
    {{- include "authup.tplvalues.render" (dict "value" .Values.accountConsole.networkPolicy.extraEgress "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
