{{- if and .Values.server.enabled .Values.server.splitConsoles .Values.accountConsole.enabled (include "authup.flag" (dict "value" .Values.accountConsole.route.enabled "context" $ "key" "accountConsole.route.enabled")) }}
{{- $route := .Values.accountConsole.route -}}
{{- $hostnames := $route.hostnames -}}
{{- if not $hostnames -}}
{{- $origin := include "authup.urlOrigin" (include "authup.server.publicUrl" .) -}}
{{- if $origin -}}
{{- $hostnames = list (regexReplaceAll ":[0-9]+$" (regexReplaceAll "^https?://" $origin "") "") -}}
{{- end -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "authup.accountConsole.fullname" . }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "account-console") | nindent 4 }}
  annotations:
    {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
    {{- if $route.annotations }}
    {{- include "authup.tplvalues.render" (dict "value" $route.annotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  {{- if $route.parentRefs }}
  parentRefs: {{- include "authup.tplvalues.render" (dict "value" $route.parentRefs "context" $) | nindent 4 }}
  {{- else if .Values.server.route.parentRefs }}
  parentRefs: {{- include "authup.tplvalues.render" (dict "value" .Values.server.route.parentRefs "context" $) | nindent 4 }}
  {{- end }}
  {{- if $hostnames }}
  hostnames:
    {{- range $hostnames }}
    - {{ include "authup.tplvalues.render" (dict "value" . "context" $) | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        {{- if $route.matches }}
        {{- include "authup.tplvalues.render" (dict "value" $route.matches "context" $) | nindent 8 }}
        {{- else }}
        - path:
            type: PathPrefix
            value: /console/account
        {{- end }}
      filters:
        {{- if $route.filters }}
        {{- include "authup.tplvalues.render" (dict "value" $route.filters "context" $) | nindent 8 }}
        {{- else }}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        {{- end }}
      backendRefs:
        - name: {{ include "authup.accountConsole.fullname" . }}
          port: {{ .Values.accountConsole.service.ports.http }}
{{- end }}
