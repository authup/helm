{{- if and .Values.adminConsole.enabled .Values.adminConsole.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authup.adminConsole.fullname" . }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "admin-console") | nindent 4 }}
  annotations: {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "authup.matchLabels" (dict "context" $ "component" "admin-console") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
      {{- if not .Values.adminConsole.networkPolicy.allowExternal }}
      {{- /* An empty `from:` would mean allow-all — always emit at least the
             same-namespace baseline peer. */}}
      from:
        - podSelector: {}
        {{- if .Values.adminConsole.networkPolicy.ingressPodMatchLabels }}
        - podSelector:
            matchLabels: {{- include "authup.tplvalues.render" (dict "value" .Values.adminConsole.networkPolicy.ingressPodMatchLabels "context" $) | nindent 14 }}
        {{- end }}
        {{- if .Values.adminConsole.networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels: {{- include "authup.tplvalues.render" (dict "value" .Values.adminConsole.networkPolicy.ingressNSMatchLabels "context" $) | nindent 14 }}
        {{- end }}
      {{- end }}
    {{- if .Values.adminConsole.networkPolicy.extraIngress }}
    {{- include "authup.tplvalues.render" (dict "value" .Values.adminConsole.networkPolicy.extraIngress "context" $) | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.adminConsole.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # server-core within the release
    - to:
        - podSelector:
            matchLabels: {{- include "authup.matchLabels" (dict "context" $ "component" "server") | nindent 14 }}
    {{- end }}
    {{- if .Values.adminConsole.networkPolicy.extraEgress }}
    {{- include "authup.tplvalues.render" (dict "value" .Values.adminConsole.networkPolicy.extraEgress "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
