{{- if and .Values.server.enabled .Values.server.splitConsoles .Values.authConsole.enabled .Values.authConsole.autoscaling.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "authup.authConsole.fullname" . }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $ "component" "auth-console") | nindent 4 }}
  annotations: {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "authup.authConsole.fullname" . }}
  minReplicas: {{ .Values.authConsole.autoscaling.hpa.minReplicas }}
  maxReplicas: {{ .Values.authConsole.autoscaling.hpa.maxReplicas }}
  metrics:
    {{- if .Values.authConsole.autoscaling.hpa.targetCPU }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.authConsole.autoscaling.hpa.targetCPU }}
    {{- end }}
    {{- if .Values.authConsole.autoscaling.hpa.targetMemory }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.authConsole.autoscaling.hpa.targetMemory }}
    {{- end }}
{{- end }}
