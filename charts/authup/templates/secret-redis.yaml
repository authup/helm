{{/*
External Redis connection URL secret. The URL embeds the password, so it is
always stored in a Secret. With externalRedis.existingSecret the user's secret
must hold a full connection URL under externalRedis.existingSecretKey.
*/}}
{{- if and (not .Values.valkey.enabled) (not .Values.externalRedis.existingSecret) (or .Values.externalRedis.url .Values.externalRedis.host) }}
{{- $url := .Values.externalRedis.url }}
{{- if not $url }}
{{- $host := include "authup.tplvalues.render" (dict "value" .Values.externalRedis.host "context" $) }}
{{- if .Values.externalRedis.password }}
{{- $url = printf "redis://default:%s@%s:%v" (urlquery .Values.externalRedis.password) $host .Values.externalRedis.port }}
{{- else }}
{{- $url = printf "redis://%s:%v" $host .Values.externalRedis.port }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-redis" (include "authup.fullname" .) }}
  namespace: {{ include "authup.namespace" . | quote }}
  labels: {{- include "authup.labels" (dict "context" $) | nindent 4 }}
  annotations: {{- include "authup.annotations" (dict "context" $) | nindent 4 }}
type: Opaque
data:
  redis-connection-string: {{ $url | b64enc | quote }}
{{- end }}
