name: release

on:
  push:
    branches:
      - master
  # Re-run the publish step for whatever Chart.yaml currently holds, without a new
  # commit: the recovery path when a publish failed on its own (a broken releaser,
  # an API hiccup) after release-please already merged the version bump.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Runs on every master push. hevi compares Chart.yaml's version against the
  # published releases (cr --skip-existing) and against the OCI registry
  # (push-skip-existing), so this is an idempotent no-op until the release-please
  # PR carrying a version bump is merged. Do NOT gate this on release-please
  # outputs: the chart package uses skip-github-release (chart-releaser owns tags
  # + releases), so releases_created never fires for it.
  publish:
    runs-on: ubuntu-latest
    needs: release-please
    # release-please is skipped on workflow_dispatch, and a skipped dependency
    # would skip this job too without an explicit condition.
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # hevi prefers a helm from PATH over its own pinned download, so pin it
      # here to keep the packaged output independent of the runner image.
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package, release and push charts
        uses: tada5hi/hevi@v2
        with:
          directory: charts
          package: true
          release: true
          release-generate-notes: true
          push: true
          push-host: ghcr.io/${{ github.repository_owner }}/helm
          push-username: ${{ github.actor }}
          push-password: ${{ secrets.GITHUB_TOKEN }}
          push-skip-existing: true

      # release-please labels a release PR "autorelease: pending" when it opens it
      # and only clears the label in the release step, which skip-github-release
      # turns off (chart-releaser owns tags + releases). The merged PR therefore
      # keeps the label forever, and from then on every run aborts PR creation
      # with "There are untagged, merged release PRs outstanding" while still
      # exiting 0, so the job looks green. Clear it here, once the charts really
      # are published. Delete this step if release-please ever owns the release.
      - name: Clear the release-please pending label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Assigned, not piped into the loop: a failing query would otherwise
          # read as "nothing pending" and leave the deadlock in place, green.
          pending=$(gh pr list --state merged --base master \
            --label 'autorelease: pending' --json number --jq '.[].number')
          for pr in $pending; do
            echo "Marking pull request #${pr} as released"
            gh pr edit "$pr" --remove-label 'autorelease: pending'
          done
