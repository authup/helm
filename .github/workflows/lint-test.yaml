name: lint-test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run chart-testing (lint)
        run: ct lint --config .github/configs/ct.yaml

      - name: Check helm-docs sync
        run: |
          make docs
          if [[ -n "$(git status --porcelain)" ]]; then
            echo -e '\033[0;31mDocumentation outdated!\033[0m Run "make docs" and commit the changes.'
            git status --porcelain
            git diff --color
            exit 1
          fi

      - name: Check values.schema.json sync
        run: |
          make schema
          if [[ -n "$(git status --porcelain)" ]]; then
            echo -e '\033[0;31mSchema outdated!\033[0m Run "make schema" and commit the changes.'
            git status --porcelain
            git diff --color
            exit 1
          fi

      - name: Check values coverage
        run: make lint-values-coverage

  lint-artifacthub:
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/artifacthub/ah:v1.23.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run ah lint
        run: ah lint
        working-directory: ./charts

  install:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/configs/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        uses: helm/kind-action@v1
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          namespace="authup-$(uuidgen | tr '[:upper:]' '[:lower:]')"
          kubectl create namespace "$namespace"
          kubectl apply -n "$namespace" -f charts/authup/ci/manifests/
          ct install --namespace "$namespace" --config .github/configs/ct.yaml
